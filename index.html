<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>魚編 ― UOHEN ― 窯出し一筆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --clay:#EDE6D6;
    --clay-deep:#DFD5BE;
    --sumi:#211F1C;
    --sumi-soft:#4A463F;
    --shu:#B33A24;
    --seiji:#7FA396;
    --seiji-deep:#5C8577;
    --line:rgba(33,31,28,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Noto Sans JP',sans-serif;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.5), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(0,0,0,0.06), transparent 60%),
      var(--clay);
    color:var(--sumi);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
  }
  .stage{
    width:100%;
    max-width:460px;
    min-height:100vh;
    padding:28px 20px 34px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.32em;
    color:var(--sumi-soft);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:30px;
    margin:0 0 4px;
    letter-spacing:0.04em;
  }
  h1 .accent{color:var(--shu);}
  .sub{
    font-size:13px;
    color:var(--sumi-soft);
    margin-bottom:22px;
    text-align:center;
    line-height:1.7;
  }
  .screen{width:100%;display:none;flex-direction:column;align-items:center;}
  .screen.active{display:flex;}

  /* ---------- start screen ---------- */
  .kanji-preview-row{
    display:flex; gap:10px; margin:6px 0 26px; flex-wrap:wrap; justify-content:center;
  }
  .kp{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:#fff8ec;
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--sumi-soft);
  }
  .rules{
    background:#fbf7ee;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    font-size:13px;
    line-height:1.9;
    color:var(--sumi-soft);
    margin-bottom:28px;
    width:100%;
  }
  .rules b{color:var(--sumi);}
  .btn{
    font-family:'Noto Sans JP',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.06em;
    padding:14px 30px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    background:var(--sumi);
    color:var(--clay);
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn.ghost{
    background:transparent;
    color:var(--sumi);
    border:1.5px solid var(--sumi);
  }
  .btn.shu{background:var(--shu);color:#fff8ec;}
  .btn-row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center;}

  /* ---------- draw screen ---------- */
  .draw-top{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .target-tag{
    font-size:12px;
    color:var(--sumi-soft);
  }
  .target-tag b{
    font-family:'Shippori Mincho',serif;
    font-size:20px;
    color:var(--shu);
    margin-right:4px;
  }
  .timerbar-wrap{
    width:100%;
    height:6px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .timerbar{
    height:100%;
    width:100%;
    background:var(--seiji-deep);
    transition:width 0.08s linear, background .3s ease;
    border-radius:999px;
  }
  .canvas-wrap{
    position:relative;
    width:min(78vw, 320px);
    height:min(78vw, 320px);
    background:#fffaf0;
    border:1.5px solid var(--sumi);
    border-radius:16px;
    box-shadow: 0 10px 26px rgba(33,31,28,0.14);
    touch-action:none;
    overflow:hidden;
    margin-bottom:16px;
  }
  .canvas-wrap::after{
    content:"";
    position:absolute; inset:10px;
    border:1px dashed var(--line);
    border-radius:10px;
    pointer-events:none;
  }
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
  #guideCanvas{opacity:1;}
  #inkCanvas{cursor:crosshair;}

  .tool-row{
    display:flex; align-items:center; gap:14px; margin-bottom:18px;
  }
  .ink-choice{
    display:flex; gap:8px; align-items:center;
    background:#fbf7ee; border:1px solid var(--line);
    border-radius:999px; padding:5px;
  }
  .ink-dot{
    width:26px;height:26px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .ink-dot.sumi{background:var(--sumi);}
  .ink-dot.shu{background:var(--shu);}
  .ink-dot.selected{border-color:var(--seiji-deep);}
  .stroke-count{font-size:12px;color:var(--sumi-soft);}

  /* ---------- result overlay ---------- */
  .result-card{
    width:100%;
    background:#fbf7ee;
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 20px;
    text-align:center;
    margin-top:4px;
  }
  .score-num{
    font-family:'Shippori Mincho',serif;
    font-size:52px;
    font-weight:800;
    color:var(--shu);
    line-height:1;
  }
  .score-label{font-size:12px;letter-spacing:0.2em;color:var(--sumi-soft);margin-top:2px;}
  .score-msg{font-size:14px;margin:14px 0 20px;color:var(--sumi);}

  /* ---------- cup screen ---------- */
  #cupCanvasWrap{
    width:100%;
    aspect-ratio: 1 / 1.05;
    border-radius:18px;
    overflow:hidden;
    background: radial-gradient(circle at 50% 30%, #fff 0%, var(--clay-deep) 75%);
    box-shadow: inset 0 0 0 1px var(--line);
    position:relative;
    touch-action:none;
    margin-bottom:14px;
  }
  #cupCanvasWrap canvas{position:absolute;inset:0;width:100%;height:100%;}
  .drag-hint{
    position:absolute; bottom:10px; left:0; right:0;
    text-align:center; font-size:11px; color:var(--sumi-soft);
    letter-spacing:0.1em;
    pointer-events:none;
    opacity:0.75;
  }
  .cup-controls{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .glaze-row{display:flex;gap:8px;}
  .glaze-dot{
    width:24px;height:24px;border-radius:50%;
    cursor:pointer;border:2px solid transparent;
  }
  .glaze-dot.selected{border-color:var(--sumi);}
  .toggle{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--sumi-soft);
    cursor:pointer; user-select:none;
  }
  .toggle input{accent-color:var(--seiji-deep);width:15px;height:15px;}

  footer.note{
    font-size:11px;color:var(--sumi-soft);opacity:0.7;text-align:center;margin-top:8px;line-height:1.6;
  }
</style>
</head>
<body>
<div class="stage">

  <div class="eyebrow">POTTERY MINI-GAME</div>
  <h1>魚<span class="accent">編</span>ノ窯</h1>
  <div class="sub">制限時間内にスワイプで魚偏の漢字を一筆書き。<br>その筆致がそのまま湯呑みの絵付けになります。</div>

  <!-- START -->
  <div class="screen active" id="screen-start">
    <div class="kanji-preview-row" id="previewRow"></div>
    <div class="rules">
      <b>① 見本</b>を頼りに、器の内側にスワイプで線を描く<br>
      <b>② 制限時間 12秒</b>、一画＝一スワイプ<br>
      <b>③ 完成度</b>を判定し、<b>湯呑み</b>に絵付け<br>
      <b>④ ドラッグ</b>で360°鑑賞できます
    </div>
    <button class="btn shu" id="btnStart">ろくろを回す ―はじめる―</button>
  </div>

  <!-- DRAW -->
  <div class="screen" id="screen-draw">
    <div class="draw-top">
      <div class="target-tag"><b id="targetChar">鯉</b><span id="targetReading">こい</span></div>
      <div class="stroke-count">画数 <span id="strokeCount">0</span></div>
    </div>
    <div class="timerbar-wrap"><div class="timerbar" id="timerbar"></div></div>
    <div class="canvas-wrap">
      <canvas id="guideCanvas" width="320" height="320"></canvas>
      <canvas id="inkCanvas" width="320" height="320"></canvas>
    </div>
    <div class="tool-row">
      <div class="ink-choice">
        <div class="ink-dot sumi selected" data-color="#211F1C"></div>
        <div class="ink-dot shu" data-color="#B33A24"></div>
      </div>
      <button class="btn ghost" id="btnClear" style="padding:8px 16px;font-size:12px;">消す</button>
    </div>
    <button class="btn shu" id="btnFinish">書き終える</button>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <div class="score-label">完成度</div>
      <div class="score-num"><span id="scoreNum">0</span><span style="font-size:22px;">%</span></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn shu" id="btnToCup">湯呑みを見る →</button>
    </div>
  </div>

  <!-- CUP -->
  <div class="screen" id="screen-cup">
    <div id="cupCanvasWrap">
      <div class="drag-hint">← ドラッグして360°鑑賞 →</div>
    </div>
    <div class="cup-controls">
      <div class="glaze-row" id="glazeRow"></div>
      <label class="toggle"><input type="checkbox" id="autoRotate" checked> 自動回転</label>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="btnAgain">もう一度描く</button>
      <button class="btn" id="btnRestart">最初から</button>
    </div>
    <footer class="note">窯元の湯呑みは、あなたの一筆でしか生まれません。</footer>
  </div>

</div>

<script>
/* ============ DATA ============ */
const KANJI = [
  {ch:'鯉', yomi:'こい'},
  {ch:'鮭', yomi:'さけ'},
  {ch:'鯛', yomi:'たい'},
  {ch:'鰯', yomi:'いわし'},
  {ch:'鮪', yomi:'まぐろ'},
  {ch:'鯨', yomi:'くじら'},
  {ch:'鮫', yomi:'さめ'},
  {ch:'鰻', yomi:'うなぎ'},
  {ch:'鱈', yomi:'たら'},
  {ch:'鮎', yomi:'あゆ'},
  {ch:'鰹', yomi:'かつお'},
  {ch:'鰤', yomi:'ぶり'},
];
const GLAZES = [
  {name:'青磁', top:'#BFD6C9', bottom:'#7FA396'},
  {name:'白磁', top:'#FFFBF2', bottom:'#EADFC7'},
  {name:'黒釉', top:'#4B4842', bottom:'#1C1A17'},
];

let currentKanjiIdx = -1;
let lastKanjiIdx = -1;
let inkColor = '#211F1C';
let strokes = [];
let currentStroke = null;
let drawing = false;
let timerStart = 0;
let timerDuration = 12000;
let timerRAF = null;
let finished = false;
let glazeIdx = 0;

/* ============ NAV ============ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ============ START SCREEN preview ============ */
const previewRow = document.getElementById('previewRow');
KANJI.slice(0,6).forEach(k=>{
  const d = document.createElement('div');
  d.className='kp'; d.textContent=k.ch;
  previewRow.appendChild(d);
});

document.getElementById('btnStart').addEventListener('click', ()=>{
  startRound();
  showScreen('screen-draw');
});

/* ============ DRAW SCREEN ============ */
const guideCanvas = document.getElementById('guideCanvas');
const inkCanvas = document.getElementById('inkCanvas');
const gctx = guideCanvas.getContext('2d');
const ictx = inkCanvas.getContext('2d');
const timerbar = document.getElementById('timerbar');
const targetChar = document.getElementById('targetChar');
const targetReading = document.getElementById('targetReading');
const strokeCountEl = document.getElementById('strokeCount');

function pickKanji(){
  let idx;
  do{ idx = Math.floor(Math.random()*KANJI.length); }while(idx===lastKanjiIdx && KANJI.length>1);
  lastKanjiIdx = idx;
  return idx;
}

function drawGuide(ch){
  gctx.clearRect(0,0,320,320);
  gctx.fillStyle = 'rgba(33,31,28,0.16)';
  gctx.font = '800 240px "Shippori Mincho", serif';
  gctx.textAlign='center';
  gctx.textBaseline='middle';
  gctx.fillText(ch, 160, 172);
}

function clearInk(){
  ictx.clearRect(0,0,320,320);
  strokes = [];
  strokeCountEl.textContent = '0';
}

function startRound(){
  finished = false;
  currentKanjiIdx = pickKanji();
  const k = KANJI[currentKanjiIdx];
  targetChar.textContent = k.ch;
  targetReading.textContent = k.yomi;
  drawGuide(k.ch);
  clearInk();
  timerbar.style.background = 'var(--seiji-deep)';
  timerStart = performance.now();
  cancelAnimationFrame(timerRAF);
  tickTimer();
}

function tickTimer(){
  const elapsed = performance.now() - timerStart;
  const remain = Math.max(0, 1 - elapsed/timerDuration);
  timerbar.style.width = (remain*100)+'%';
  if(remain < 0.22) timerbar.style.background = 'var(--shu)';
  if(elapsed >= timerDuration){
    finishDrawing();
    return;
  }
  timerRAF = requestAnimationFrame(tickTimer);
}

function getPos(evt){
  const rect = inkCanvas.getBoundingClientRect();
  const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX);
  const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY);
  return {
    x: (cx-rect.left)/rect.width*320,
    y: (cy-rect.top)/rect.height*320,
    t: performance.now()
  };
}

function pointerDown(evt){
  if(finished) return;
  evt.preventDefault();
  drawing = true;
  const p = getPos(evt);
  currentStroke = [p];
  strokes.push(currentStroke);
  strokeCountEl.textContent = strokes.length;
}
function pointerMove(evt){
  if(!drawing || finished) return;
  evt.preventDefault();
  const p = getPos(evt);
  const prev = currentStroke[currentStroke.length-1];
  currentStroke.push(p);
  const dt = Math.max(1, p.t - prev.t);
  const dist = Math.hypot(p.x-prev.x, p.y-prev.y);
  const speed = dist/dt;
  let w = 10 - speed*10;
  w = Math.max(2.2, Math.min(11, w));
  ictx.strokeStyle = inkColor;
  ictx.lineCap='round'; ictx.lineJoin='round';
  ictx.lineWidth = w;
  ictx.beginPath();
  ictx.moveTo(prev.x, prev.y);
  ictx.lineTo(p.x, p.y);
  ictx.stroke();
}
function pointerUp(evt){
  drawing = false;
  currentStroke = null;
}

inkCanvas.addEventListener('pointerdown', pointerDown);
inkCanvas.addEventListener('pointermove', pointerMove);
window.addEventListener('pointerup', pointerUp);

document.querySelectorAll('.ink-dot').forEach(d=>{
  d.addEventListener('click', ()=>{
    document.querySelectorAll('.ink-dot').forEach(x=>x.classList.remove('selected'));
    d.classList.add('selected');
    inkColor = d.dataset.color;
  });
});
document.getElementById('btnClear').addEventListener('click', clearInk);
document.getElementById('btnFinish').addEventListener('click', ()=>finishDrawing());

/* ============ SCORING ============ */
function computeScore(){
  const gdata = gctx.getImageData(0,0,320,320).data;
  const idata = ictx.getImageData(0,0,320,320).data;
  let guidePix=0, matched=0, inkPix=0, inkOutside=0;
  for(let i=0; i<gdata.length; i+=4*3){ // sample every 3rd pixel for speed
    const ga = gdata[i+3];
    const ia = idata[i+3];
    if(ga > 40) {
      guidePix++;
      if(ia > 30) matched++;
    }
    if(ia > 30){
      inkPix++;
      if(ga <= 40) inkOutside++;
    }
  }
  if(guidePix===0) return 0;
  let base = (matched/guidePix)*100;
  const overRatio = inkPix>0 ? inkOutside/inkPix : 0;
  base = base * (1 - 0.35*overRatio);
  return Math.max(4, Math.min(99, Math.round(base)));
}

function scoreMessage(score){
  if(score>=85) return 'これはもう職人の域…！ 窯元も唸る一筆。';
  if(score>=65) return '味わい深い筆致。良い器になりそうです。';
  if(score>=40) return '個性的な仕上がり。これはこれで一興。';
  return '前衛的すぎる一筆…新しい様式かもしれません。';
}

/* ============ FINISH & RESULT ============ */
function finishDrawing(){
  if(finished) return;
  finished = true;
  cancelAnimationFrame(timerRAF);
  const score = computeScore();
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreMsg').textContent = scoreMessage(score);
  showScreen('screen-result');
}

document.getElementById('btnToCup').addEventListener('click', ()=>{
  buildCupTexture();
  showScreen('screen-cup');
  ensureCupScene();
});

/* ============ GLAZE PICKER ============ */
const glazeRow = document.getElementById('glazeRow');
GLAZES.forEach((g, i)=>{
  const d = document.createElement('div');
  d.className = 'glaze-dot' + (i===0 ? ' selected':'');
  d.style.background = `linear-gradient(160deg, ${g.top}, ${g.bottom})`;
  d.title = g.name;
  d.addEventListener('click', ()=>{
    document.querySelectorAll('.glaze-dot').forEach(x=>x.classList.remove('selected'));
    d.classList.add('selected');
    glazeIdx = i;
    buildCupTexture();
  });
  glazeRow.appendChild(d);
});

document.getElementById('btnAgain').addEventListener('click', ()=>{
  startRound();
  showScreen('screen-draw');
});
document.getElementById('btnRestart').addEventListener('click', ()=>{
  showScreen('screen-start');
});

/* ============ 3D CUP (three.js) ============ */
let scene, camera, renderer, cupMesh, texCanvas, texture, cupInited=false;
let dragging=false, lastX=0, lastY=0, rotY=0, rotVelocity=0.0025, tiltX=-0.18;
let autoRotateOn = true;

function buildCupTexture(){
  const W = 1024, H = 512;
  if(!texCanvas){ texCanvas = document.createElement('canvas'); texCanvas.width=W; texCanvas.height=H; }
  const tctx = texCanvas.getContext('2d');
  const g = GLAZES[glazeIdx];
  const grad = tctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, g.top);
  grad.addColorStop(1, g.bottom);
  tctx.fillStyle = grad;
  tctx.fillRect(0,0,W,H);

  // subtle horizontal glaze streaks
  tctx.globalAlpha = 0.06;
  for(let i=0;i<40;i++){
    tctx.fillStyle = i%2===0 ? '#ffffff' : '#000000';
    tctx.fillRect(0, Math.random()*H, W, 1.5);
  }
  tctx.globalAlpha = 1;

  // draw the ink drawing repeated around the belly band
  const bandY = H*0.30, bandH = H*0.42;
  const repeats = 3;
  const tileW = W/repeats;
  for(let r=0;r<repeats;r++){
    tctx.save();
    tctx.beginPath();
    tctx.rect(r*tileW, 0, tileW, H);
    tctx.clip();
    tctx.drawImage(inkCanvas, r*tileW + tileW*0.08, bandY, tileW*0.84, bandH);
    tctx.restore();
  }

  // seal stamp (印)
  const sealSize = 34;
  const sx = W - repeats===0?0:W*0.94 - sealSize, sy = H*0.78;
  tctx.fillStyle = 'rgba(179,58,36,0.88)';
  tctx.fillRect(W*0.90, sy, sealSize, sealSize);
  tctx.fillStyle = '#fdf6e8';
  tctx.font = '700 20px "Shippori Mincho", serif';
  tctx.textAlign='center'; tctx.textBaseline='middle';
  tctx.fillText('窯', W*0.90+sealSize/2, sy+sealSize/2+1);

  if(!texture){
    texture = new THREE.CanvasTexture(texCanvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
  } else {
    texture.needsUpdate = true;
  }
  if(cupMesh){
    cupMesh.material.map = texture;
    cupMesh.material.needsUpdate = true;
  }
}

function buildCupProfile(){
  // [radius, height] outer wall up, rim, inner wall down
  const raw = [
    [0.0, 0.0],
    [0.40, 0.0],
    [0.44, 0.05],
    [0.36, 0.11],
    [0.46, 0.24],
    [0.58, 0.48],
    [0.65, 0.78],
    [0.67, 1.06],
    [0.65, 1.34],
    [0.61, 1.52],
    [0.64, 1.64],
    [0.685,1.72],
    [0.64, 1.755],
    [0.585,1.68],
    [0.545,1.40],
    [0.49, 1.02],
    [0.45, 0.62],
    [0.41, 0.26],
    [0.39, 0.06],
  ];
  return raw.map(p=> new THREE.Vector2(p[0], p[1]));
}

function ensureCupScene(){
  if(cupInited){ return; }
  cupInited = true;
  const wrap = document.getElementById('cupCanvasWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;

  scene = new THREE.Scene();
  scene.background = null;

  camera = new THREE.PerspectiveCamera(38, w/h, 0.1, 100);
  camera.position.set(0, 1.35, 5.2);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  wrap.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xfff6e6, 0x3a3630, 0.9);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xfff2df, 1.05);
  dir.position.set(2.5, 4, 3);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xcfe0da, 0.4);
  dir2.position.set(-3, 1, -2);
  scene.add(dir2);

  const points = buildCupProfile();
  const geo = new THREE.LatheGeometry(points, 72);
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: 0.42,
    metalness: 0.02,
    side: THREE.DoubleSide,
  });

  cupMesh = new THREE.Mesh(geo, mat);
  cupMesh.position.y = -0.85;
  scene.add(cupMesh);

  // soft ground shadow-ish disc
  const discGeo = new THREE.CircleGeometry(1.1, 48);
  const discMat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.10});
  const disc = new THREE.Mesh(discGeo, discMat);
  disc.rotation.x = -Math.PI/2;
  disc.position.y = -0.86;
  scene.add(disc);

  camera.lookAt(0, 0.15, 0);

  // drag rotate
  const dom = renderer.domElement;
  const onDown = (e)=>{ dragging=true; const p=getClient(e); lastX=p.x; lastY=p.y; };
  const onMove = (e)=>{
    if(!dragging) return;
    const p = getClient(e);
    const dx = p.x-lastX, dy = p.y-lastY;
    rotY += dx*0.008;
    tiltX = Math.max(-0.55, Math.min(0.1, tiltX + dy*0.003));
    lastX=p.x; lastY=p.y;
  };
  const onUp = ()=>{ dragging=false; };
  function getClient(e){
    if(e.touches) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
    return {x:e.clientX, y:e.clientY};
  }
  dom.addEventListener('pointerdown', (e)=>{ onDown(e); dom.setPointerCapture(e.pointerId); });
  dom.addEventListener('pointermove', onMove);
  dom.addEventListener('pointerup', onUp);
  dom.addEventListener('pointerleave', onUp);

  window.addEventListener('resize', ()=>{
    const w2 = wrap.clientWidth, h2 = wrap.clientHeight;
    camera.aspect = w2/h2;
    camera.updateProjectionMatrix();
    renderer.setSize(w2, h2);
  });

  animateCup();
}

function animateCup(){
  requestAnimationFrame(animateCup);
  if(!dragging && autoRotateOn){ rotY += rotVelocity; }
  if(cupMesh){
    cupMesh.rotation.y = rotY;
  }
  const radius = 5.2;
  camera.position.x = 0;
  camera.position.y = 1.35 + tiltX*2.2;
  camera.position.z = radius;
  camera.lookAt(0, 0.05, 0);
  if(renderer) renderer.render(scene, camera);
}

document.getElementById('autoRotate').addEventListener('change', (e)=>{
  autoRotateOn = e.target.checked;
});
</script>
</body>
</html>
